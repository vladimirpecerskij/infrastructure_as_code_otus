---
- name: Install Python3 and PostgreSQL client
  apt:
    name: [python3, python3-pip, postgresql-client]
    state: present
    update_cache: yes

- name: Create simple backend API service
  copy:
    dest: /opt/backend_app.py
    content: |
      from http.server import HTTPServer, BaseHTTPRequestHandler
      import os
      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              self.send_response(200)
              self.end_headers()
              msg = f"Backend OK | Connected DB: {os.environ.get('DB_HOST', 'unknown')}\n"
              self.wfile.write(msg.encode())
      HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()

- name: Create systemd unit for backend
  copy:
    dest: /etc/systemd/system/backend.service
    content: |
      [Unit]
      Description=Python Backend Service
      After=network.target
      [Service]
      Environment="DB_HOST={{ db_host }}"
      ExecStart=/usr/bin/python3 /opt/backend_app.py
      Restart=always
      [Install]
      WantedBy=multi-user.target

- name: Start backend service
  systemd:
    name: backend
    state: restarted
    enabled: yes
    daemon_reload: yes
