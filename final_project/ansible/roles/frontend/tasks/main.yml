---
- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Configure Nginx reverse proxy to Backend
  copy:
    dest: /etc/nginx/sites-available/default
    content: |
      server {
          listen 80;
          location / {
              proxy_pass http://{{ backend_private_ip }}:8080;
              proxy_set_header Host $host;
          }
      }

- name: Restart Nginx
  service:
    name: nginx
    state: restarted
    enabled: yes
