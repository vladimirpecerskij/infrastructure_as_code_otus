stages:
  - deploy

ansible_deploy_with_vault:
  stage: deploy
  image: cytopia/ansible:latest
  before_script:
    # Создаём файл пароля из защищённой переменной GitLab CI/CD (Masked)
    - echo "$ANSIBLE_VAULT_PASSWORD" > /tmp/.vault_pass
    - chmod 600 /tmp/.vault_pass
  script:
    - ansible-playbook site.yml --vault-password-file /tmp/.vault_pass
  after_script:
    # Обязательно удаляем файл пароля после завершения джобы
    - rm -f /tmp/.vault_pass
